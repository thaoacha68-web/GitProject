<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của tôi</title>
    <!-- Kết nối file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề <h1> -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Đoạn văn <p> mô tả bản thân -->
    <p class="description">
        Xin chào! Tôi là một học viên đam mê lập trình và phát triển web. Tôi đang học cách sử dụng HTML và CSS để tạo ra những trang web đẹp mắt và tối ưu.
    </p>

    <!-- Danh sách <ul> liệt kê 3 sở thích -->
    <div class="hobbies-container">
        <h2>Sở thích của tôi:</h2>
        <ul class="hobby-list">
            <li class="hobby-item coding">Đọc sách và viết code</li>
            <li class="hobby-item music">Nghe nhạc thư giãn</li>
            <li class="hobby-item travel">Đi du lịch trải nghiệm</li>
        </ul>
    </div>

    <!-- Nút bấm <button> -->
    <div class="button-container">
        <button class="my-btn">Nhấn vào đây</button>
    </div>

</body>
</html>
