<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Bảng trong CSS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: darkblue;
        }

        table {
            width: 100%;
            border: 2px solid black;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
        }

        th {
            height: 50px;
            background-color: lightblue;
            color: darkblue;
            text-align: left;
        }

        td {
            text-align: left;
            vertical-align: bottom;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Bảng trong CSS</h1>

    <table>
        <tr>
            <th>STT</th>
            <th>Họ và tên</th>
            <th>Môn học</th>
            <th>Điểm</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Nguyễn Văn A</td>
            <td>HTML</td>
            <td>9</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Trần Thị B</td>
            <td>CSS</td>
            <td>8</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Lê Văn C</td>
            <td>JavaScript</td>
            <td>9.5</td>
        </tr>
    </table>

</body>
</html>
