<!DOCTYPE html>
<html>
<head>
<style>
ul.a {
  list-style-type: circle;
}

ul.b {
  list-style-type: square;
}

ol.c {
  list-style-type: upper-roman;
}

ol.d {
  list-style-type: lower-alpha;
}
</style>
</head>

<body>

<h2>Danh sách không có thứ tự</h2>

<ul class="a">
  <li>Cà phê</li>
  <li>Trà</li>
  <li>Sữa</li>
</ul>

<ul class="b">
  <li>Cà phê</li>
  <li>Trà</li>
  <li>Sữa</li>
</ul>

<h2>Danh sách có thứ tự</h2>

<ol class="c">
  <li>Cà phê</li>
  <li>Trà</li>
  <li>Sữa</li>
</ol>

<ol class="d">
  <li>Cà phê</li>
  <li>Trà</li>
  <li>Sữa</li>
</ol>

</body>
</html>
