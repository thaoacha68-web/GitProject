```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhúng CSS vào HTML</title>

    <!-- Phần 2: Internal CSS -->
    <style>
        .internal {
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Thực hành nhúng CSS vào HTML</h1>

    <!-- Phần 1: Inline CSS -->
    <p style="color: red;">
        Phần 1: Đây là đoạn văn sử dụng Inline CSS.
    </p>

    <!-- Phần 2: Internal CSS -->
    <p class="internal">
        Phần 2: Đây là đoạn văn sử dụng Internal CSS.
    </p>

    <!-- Phần 3: CSS bên ngoài -->
    <p class="external">
        Phần 3: Đây là đoạn văn sử dụng CSS bên ngoài.
    </p>

</body>
</html>
```
