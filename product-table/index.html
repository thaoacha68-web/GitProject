<!DOCTYPE html>
<html>

    <title>Danh sách sản phẩm</title>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table border="1">
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>

        <tr>
            <td>Áo thun</td>
            <td>100.000 VNĐ</td>
            <td>10</td>
        </tr>

        <tr>
            <td>Quần jean</td>
            <td>250.000 VNĐ</td>
            <td>5</td>
        </tr>

        <tr>
            <td>Giày thể thao</td>
            <td>500.000 VNĐ</td>
            <td>8</td>
        </tr>

        <tr>
            <td>Mũ lưỡi trai</td>
            <td>80.000 VNĐ</td>
            <td>15</td>
        </tr>
    </table>

</body>
</html>
